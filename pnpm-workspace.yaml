packages:
  - '.'
  - 'chrome-extension'
  - 'mobile-app'
  - 'workers/extractor'

patchedDependencies:
  expo-modules-core@55.0.17: patches/expo-modules-core@55.0.17.patch

# pnpm 11 fails the install on dependency build scripts nobody has decided on.
# These were skipped under pnpm 10 and the app builds and runs fine without
# them (sharp, esbuild and workerd ship prebuilt binaries as optional
# packages), so record that choice as "do not run".
allowBuilds:
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  esbuild: false
  protobufjs: false
  sharp: false
  utf-8-validate: false
  workerd: false
